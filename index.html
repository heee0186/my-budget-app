<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f2">
<title>가계부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<style>
  :root {
    --paper: #f5f5f2;     /* 바탕 */
    --sheet: #ffffff;     /* 시트·입력칸 */
    --ink: #17181a;       /* 글자 */
    --ink-2: #5c5f66;     /* 보조 글자 */
    --ink-3: #9a9ca1;     /* 흐린 글자 */
    --rule: #e2e2dd;      /* 구분선 */
    --track: #e9e9e4;     /* 빈 막대 */
    --lotte: #da291c; --nh: #00965e; --samsung: #1a3fa6;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .num { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: none; padding: 0; }
  input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 6px; }
  .wrap { max-width: 460px; margin: 0 auto; padding: 28px 20px 120px; }

  /* 머리 */
  .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .head h1 { margin: 0; font-size: 28px; line-height: 1.2; font-weight: 700; letter-spacing: -0.03em; }
  .head .lead { margin: 6px 0 0; color: var(--ink-2); font-size: 14px; }
  .months { display: flex; gap: 2px; margin-top: 2px; }
  .months button { width: 36px; height: 36px; border-radius: 50%; color: var(--ink-2); font-size: 18px; }
  .months button:active { background: var(--rule); }
  .back-now { margin-top: 10px; font-size: 13px; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

  .alert { margin: 18px 0 0; padding: 12px 14px; border-radius: 12px; background: #fff; border: 1.5px solid var(--ink); font-size: 14px; }
  .alert b { display: block; margin-bottom: 2px; }

  /* 카드 목록 */
  .cards { margin-top: 22px; border-top: 1.5px solid var(--ink); }
  .row { display: block; width: 100%; text-align: left; padding: 18px 0 20px; border-bottom: 1px solid var(--rule); }
  .row-top { display: flex; justify-content: space-between; align-items: baseline; }
  .row-name { font-size: 15px; font-weight: 600; }
  .row-when { font-size: 13px; color: var(--ink-2); }
  .row-amount { margin: 4px 0 10px; font-size: 32px; font-weight: 700; line-height: 1.15; display: flex; align-items: baseline; gap: 8px; }
  .row-amount small { font-size: 15px; font-weight: 600; }
  .over-tag { font-size: 12px; font-weight: 600; color: #fff; padding: 2px 7px; border-radius: 999px; align-self: center; }
  .unset { font-size: 17px; font-weight: 600; color: var(--ink-2); margin: 6px 0 10px; }
  .bar { position: relative; height: 12px; border-radius: 6px; background: var(--track); overflow: hidden; display: flex; }
  .bar i { display: block; height: 100%; }
  .bar .tick { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--ink); }
  .row-meta { margin-top: 9px; display: flex; gap: 14px; font-size: 13px; color: var(--ink-2); }
  .row-meta b { color: var(--ink); font-weight: 600; }

  /* 곧 빠져나갈 돈 */
  .soon { display: flex; width: 100%; align-items: center; gap: 12px; margin: 0 0 26px; padding: 14px 16px; border-radius: 14px; background: var(--ink); color: #fff; text-align: left; }
  .soon .k { font-size: 14px; font-weight: 600; }
  .soon .when { font-size: 12.5px; color: #b9bbc0; }
  .soon .v { margin-left: auto; font-size: 18px; font-weight: 700; }
  .soon .chev { color: #8d9096; font-size: 18px; }
  .pay-list { list-style: none; margin: 18px 0 0; padding: 0; border-top: 1px solid var(--rule); }
  .pay-list li { display: grid; grid-template-columns: 44px 1fr auto; gap: 8px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--rule); }
  .pay-list .d { color: var(--ink-2); font-size: 13px; }
  .pay-list .acct { display: block; color: var(--ink-3); font-size: 12px; }
  .pay-list .v { font-weight: 600; }

  .review-btn { display: block; width: 100%; margin-top: 26px; padding: 14px 16px; border-radius: 12px; border: 1.5px solid var(--ink); text-align: left; font-weight: 600; }
  .review-btn::after { content: '›'; float: right; color: var(--ink-2); }
  .collector { margin-top: 30px; font-size: 12.5px; color: var(--ink-3); }
  .logout { margin-top: 8px; font-size: 12.5px; color: var(--ink-3); text-decoration: underline; text-underline-offset: 3px; }

  /* 탭 */
  .tabs { display: flex; gap: 18px; margin: -8px 0 18px; }
  .tabs button { font-size: 15px; font-weight: 600; color: var(--ink-3); padding: 6px 0; border-bottom: 2px solid transparent; }
  .tabs button[aria-current="page"] { color: var(--ink); border-color: var(--ink); }
  .banner { display: block; width: 100%; text-align: left; margin: 0 0 16px; padding: 13px 16px; border-radius: 14px; border: 1.5px solid var(--ink); background: #fff; font-size: 14px; }
  .banner b { display: block; font-size: 15px; }
  .banner::after { content: '›'; float: right; margin-top: -30px; color: var(--ink-2); font-size: 18px; }

  /* 계획 */
  .plan { margin-top: 22px; border-top: 1.5px solid var(--ink); }
  .pl { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: baseline; width: 100%; text-align: left; padding: 14px 0; border-bottom: 1px solid var(--rule); }
  .pl .n { font-size: 15px; font-weight: 600; }
  .pl .v { font-size: 16px; font-weight: 600; }
  .pl .s { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink-2); }
  .pl .s.flag { color: #b26a00; }
  .pl.child { padding: 11px 0 11px 14px; }
  .pl.child .n { font-weight: 500; }
  .pl.child .v { font-weight: 500; font-size: 15px; }
  .pl-h { display: flex; justify-content: space-between; align-items: baseline; padding: 22px 0 8px; border-bottom: 1px solid var(--rule); }
  .pl-h strong { font-size: 16px; }
  .pl-h span { font-size: 15px; font-weight: 600; color: var(--ink-2); }
  .pl-sum { display: flex; justify-content: space-between; align-items: baseline; padding: 16px 0; border-bottom: 1.5px solid var(--ink); }
  .pl-sum strong { font-size: 16px; }
  .pl-sum span { font-size: 22px; font-weight: 700; }
  .tip { margin-top: 18px; padding: 14px 16px; border-radius: 14px; background: #fff; border: 1px solid var(--rule); font-size: 14px; color: var(--ink-2); }
  .tip b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 2px; }
  .chip { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--track); color: var(--ink-2); margin-left: 6px; vertical-align: 1px; }
  .pick.five { grid-template-columns: repeat(5, 1fr); }
  .pick.five button { font-size: 13px; padding: 0 2px; }
  .pick button.sel { background: var(--ink); border-color: var(--ink); color: #fff; }

  /* 아래 고정 버튼 */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 20px calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--paper) 70%, rgba(245,245,242,0)); }
  .dock button { display: block; width: 100%; max-width: 420px; margin: 0 auto; height: 52px; border-radius: 14px; background: var(--ink); color: #fff; font-size: 16px; font-weight: 600; }

  /* 시트 */
  .scrim { position: fixed; inset: 0; background: rgba(23,24,26,.38); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 40; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 460px; margin: 0 auto; max-height: 88vh; overflow-y: auto; background: var(--sheet); border-radius: 22px 22px 0 0; padding: 10px 20px calc(22px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1); }
  .sheet.on { transform: none; }
  .grip { width: 36px; height: 4px; border-radius: 2px; background: var(--rule); margin: 0 auto 14px; }
  .sheet h3 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .sheet .lead { margin: 4px 0 0; color: var(--ink-2); font-size: 14px; }
  .sheet-amount { margin: 14px 0 10px; font-size: 34px; font-weight: 700; line-height: 1.1; }
  .label { display: block; margin: 18px 0 6px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .input { width: 100%; height: 52px; border: 1.5px solid var(--rule); border-radius: 12px; padding: 0 14px; font-size: 18px; background: #fff; }
  .input:focus { border-color: var(--ink); outline: none; }
  .money { position: relative; }
  .money .input { padding-right: 36px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .money::after { content: '원'; position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-2); font-size: 16px; }
  .hint { margin-top: 6px; font-size: 12.5px; color: var(--ink-3); }
  .err { margin-top: 8px; font-size: 13.5px; color: #b3261e; min-height: 1em; }
  .btn { display: block; width: 100%; height: 52px; border-radius: 14px; background: var(--ink); color: #fff; font-size: 16px; font-weight: 600; margin-top: 16px; }
  .btn.quiet { background: none; color: var(--ink-2); height: 44px; margin-top: 4px; font-weight: 500; }
  .btn.danger { background: #b3261e; }
  .pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pick button { height: 46px; border-radius: 12px; border: 1.5px solid var(--rule); font-weight: 600; color: var(--ink-2); }
  .pick button[aria-pressed="true"] { color: #fff; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  select.input { appearance: none; font-size: 16px; }

  .items { margin-top: 18px; border-top: 1px solid var(--rule); }
  .item { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 12px 0; border-bottom: 1px solid var(--rule); }
  .item .d { font-size: 12.5px; color: var(--ink-3); }
  .item .t { min-width: 0; }
  .item .t span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .t em { font-style: normal; font-size: 12px; color: var(--ink-3); }
  .item .v { font-weight: 600; }
  .items-empty { padding: 18px 0; color: var(--ink-3); font-size: 14px; text-align: center; }
  .section-h { display: flex; justify-content: space-between; align-items: baseline; margin-top: 24px; }
  .section-h strong { font-size: 15px; }
  .section-h span { font-size: 13px; color: var(--ink-3); }

  .toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top)); transform: translate(-50%, -8px); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 60; white-space: nowrap; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* 로그인 */
  #auth { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  #auth form { width: 100%; max-width: 360px; }
  #auth h1 { margin: 0 0 4px; font-size: 28px; letter-spacing: -0.03em; }
  body.authed #auth { display: none; }
  body:not(.authed) #app, body:not(.authed) .dock { display: none; }

  @media (prefers-reduced-motion: reduce) { .sheet, .scrim, .toast { transition: none; } }
</style>
</head>
<body>

<section id="auth">
  <form id="auth-form" autocomplete="on">
    <h1>가계부</h1>
    <p class="lead" style="margin:0 0 8px;color:var(--ink-2)">로그인하면 이 기기에서는 계속 유지돼요.</p>
    <label class="label" for="auth-email">이메일</label>
    <input class="input" id="auth-email" type="email" autocomplete="username" required>
    <label class="label" for="auth-password">비밀번호</label>
    <input class="input" id="auth-password" type="password" autocomplete="current-password" required>
    <div class="err" id="auth-error" role="alert"></div>
    <button class="btn" type="submit" id="auth-submit">로그인</button>
  </form>
</section>

<main id="app" class="wrap">
  <nav class="tabs" aria-label="화면">
    <button id="tab-spend" aria-current="page" onclick="setTab('spend')">지출</button>
    <button id="tab-plan" onclick="setTab('plan')">계획</button>
  </nav>
  <button class="banner" id="payslip" onclick="openSalary(salaryBillMonth())" hidden></button>
  <button class="soon" id="soon" onclick="openSoon()" hidden></button>
  <header class="head">
    <div>
      <h1 id="title">다음 결제</h1>
      <p class="lead" id="lead"></p>
      <button class="back-now" id="back-now" onclick="goCurrent()" hidden>다음 결제로 돌아가기</button>
    </div>
    <div class="months">
      <button onclick="moveMonth(-1)" aria-label="이전 달">‹</button>
      <button onclick="moveMonth(1)" aria-label="다음 달">›</button>
    </div>
  </header>

  <div class="alert" id="alert" hidden></div>

  <section class="cards" id="cards" aria-label="카드별 남은 예산"></section>
  <section class="plan" id="plan" aria-label="급여 계획" hidden></section>


  <button class="review-btn" id="review-btn" onclick="openReviews()" hidden></button>
  <p class="collector" id="collector"></p>
  <button class="logout" onclick="openLogout()">로그아웃</button>
</main>

<div class="dock"><button onclick="openAdd()">직접 기록하기</button></div>

<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
<div class="toast" id="toast" role="status"></div>

<script>
// 공개용 publishable 키예요. 실제 보호는 로그인 + 권한 정책(supabase/1-schema.sql)이 해요.
const SUPABASE_URL = 'https://wlrenrjgwqefumsenihc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_cLjOP5RHJNzS5fJlGaA9TA_Heu3DNKS';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { db: { schema: 'gagyebu' } });

// ---------------------------------------------------------------------
// 날짜 · 청구월
//   청구월 202612 = 12월 18·20일에 빠져나가는 카드값
//   카드마다 이용기간이 달라요: 롯데 7일, 삼성 6일, 농협 5일에 새 기간 시작
// ---------------------------------------------------------------------
const SALARY_DAY = 17;
// 주말·공휴일이면 급여가 그 전 평일에 들어와요. (2027년 대체공휴일은 예상치)
const HOLIDAYS = new Set([
  '2026-01-01','2026-02-16','2026-02-17','2026-02-18','2026-03-01','2026-03-02','2026-05-01','2026-05-05',
  '2026-05-24','2026-05-25','2026-06-03','2026-06-06','2026-07-17','2026-08-15','2026-08-17','2026-09-24',
  '2026-09-25','2026-09-26','2026-10-03','2026-10-05','2026-10-09','2026-12-25',
  '2027-01-01','2027-02-06','2027-02-07','2027-02-08','2027-02-09','2027-03-01','2027-05-01','2027-05-05',
  '2027-05-13','2027-06-06','2027-07-17','2027-08-15','2027-08-16','2027-09-14','2027-09-15','2027-09-16',
  '2027-10-03','2027-10-04','2027-10-09','2027-10-11','2027-12-25','2027-12-27'
]);
const pad = n => String(n).padStart(2, '0');
const ymd = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
const Y = bm => Math.floor(bm / 100), M = bm => bm % 100;
function addMonths(bm, n) { const t = Y(bm) * 12 + M(bm) - 1 + n; return Math.floor(t / 12) * 100 + (t % 12) + 1; }
const KST = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' });
const kstDate = ts => KST.format(new Date(ts));
const today = () => kstDate(Date.now());
function addDays(d, n) { const [y, m, dd] = d.split('-').map(Number); return new Date(Date.UTC(y, m - 1, dd + n)).toISOString().slice(0, 10); }
function diffDays(a, b) { const p = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); }; return Math.round((p(b) - p(a)) / 864e5); }
const WEEK = '일월화수목금토';
const dow = d => { const [y, m, dd] = d.split('-').map(Number); return WEEK[new Date(Date.UTC(y, m - 1, dd)).getUTCDay()]; };
const md = d => `${+d.slice(5, 7)}/${+d.slice(8, 10)}`;

let CARDS = [];   // 서버의 gagyebu.cards (롯데 → 농협 → 삼성 순)
const card = id => CARDS.find(c => c.id === id);
function billMonthOf(cardId, date) {
  const [y, m, d] = date.split('-').map(Number);
  return d >= card(cardId).cycle_start ? addMonths(y * 100 + m, 1) : y * 100 + m;
}
function cycleOf(cardId, bm) {
  const s = card(cardId).cycle_start, prev = addMonths(bm, -1);
  return { start: ymd(Y(prev), M(prev), s), end: addDays(ymd(Y(bm), M(bm), s), -1) };
}
function salaryDate(bm) {
  let d = ymd(Y(bm), M(bm), SALARY_DAY);
  while ('토일'.includes(dow(d)) || HOLIDAYS.has(d)) d = addDays(d, -1);
  return d;
}
// 지금 쓰고 있는 청구월: 롯데 기준 (7일이 되면 세 카드 모두 다음 달로 넘어감)
const currentBillMonth = () => billMonthOf('lotte', today());

// 결제 한 건이 어느 청구월에 얼마씩 잡히는지 (할부는 나눠서)
function shares(p) {
  const n = Math.max(1, p.months || 1);
  const bm0 = p.first_bill_month || billMonthOf(p.card_id, kstDate(p.paid_at));
  if (n === 1) return [{ bm: bm0, amount: p.amount, k: 1, n: 1 }];
  const unit = card(p.card_id).installment_unit || 1;
  const monthly = p.monthly || Math.floor(p.amount / n / unit) * unit;
  const first = p.amount - monthly * (n - 1);
  return Array.from({ length: n }, (_, i) => ({ bm: addMonths(bm0, i), amount: i === 0 ? first : monthly, k: i + 1, n }));
}

// 카드 색: 막대·남은 금액·선택 버튼 모두 이 색을 따라가요
const BRAND = { lotte: 'var(--lotte)', nh: 'var(--nh)', samsung: 'var(--samsung)' };
const tint = (id, pct) => `color-mix(in srgb, ${BRAND[id]} ${pct}%, #ffffff)`;

// ---------------------------------------------------------------------
// 상태
// ---------------------------------------------------------------------
let viewBM = null;
let payments = [];
let budgets = [];
let status = null;
let loadSeq = 0;

const won = n => `${Math.round(n).toLocaleString('ko-KR')}원`;
const comma = n => Math.round(n).toLocaleString('ko-KR');
const num = s => { const t = String(s ?? '').trim(); const v = parseInt(t.replace(/[^0-9]/g, ''), 10); return isNaN(v) ? 0 : (t.startsWith('-') ? -v : v); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mdKo = d => `${+d.slice(5, 7)}월 ${+d.slice(8, 10)}일`;

function budgetFor(cardId, bm) {
  const rows = budgets.filter(b => b.card_id === cardId && b.bill_month <= bm).sort((a, b) => b.bill_month - a.bill_month);
  return rows.length ? rows[0].amount : 0;
}

// 이 청구월에 카드별로 잡히는 결제·할부
function monthOf(cardId, bm) {
  const rows = [];
  payments.filter(p => p.card_id === cardId).forEach(p => shares(p).forEach(s => { if (s.bm === bm) rows.push({ p, s }); }));
  rows.sort((a, b) => (a.p.paid_at < b.p.paid_at ? 1 : -1));
  // 할부 2회차부터는 '이미 정해진 돈'. 첫 회차는 이번에 쓴 돈으로 봐요
  const inst = rows.filter(r => r.s.n > 1 && r.s.k > 1).reduce((a, r) => a + r.s.amount, 0);
  const total = rows.reduce((a, r) => a + r.s.amount, 0);
  const budget = budgetFor(cardId, bm);
  return { rows, inst, used: total - inst, total, budget, left: budget - total };
}

function payDate(cardId, bm) { return ymd(Y(bm), M(bm), card(cardId).pay_day); }

// ---------------------------------------------------------------------
// 불러오기
// ---------------------------------------------------------------------
async function load() {
  const seq = ++loadSeq;
  try {
    if (!CARDS.length) {
      const { data, error } = await db.from('cards').select('*').order('sort');
      if (error) throw error;
      CARDS = data;
    }
    if (viewBM === null) viewBM = currentBillMonth();
    const from = cycleOf('nh', addMonths(viewBM, -25)).start;
    const to = addDays(cycleOf('lotte', viewBM).end, 1);
    const all = [];
    for (let off = 0; ; off += 1000) {
      const { data, error } = await db.from('payments').select('*').eq('hidden', false)
        .gte('paid_at', from + 'T00:00:00+09:00').lt('paid_at', to + 'T00:00:00+09:00')
        .order('paid_at', { ascending: false }).range(off, off + 999);
      if (error) throw error;
      all.push(...data);
      if (data.length < 1000) break;
    }
    const b = await db.from('budgets').select('*');
    if (b.error) throw b.error;
    const sa = await db.from('salaries').select('*');
    const it = await db.from('plan_items').select('*').order('sort').order('id');
    const s = await db.rpc('collector_status');
    if (seq !== loadSeq) return;
    payments = all; budgets = b.data; status = s.data && s.data[0] ? s.data[0] : null;
    salaries = sa.error ? [] : sa.data; items = it.error ? [] : it.data;
  } catch (e) {
    console.error(e);
    if (seq === loadSeq) toast('자료를 불러오지 못했어요. 인터넷 연결을 확인해 주세요');
  }
  if (seq === loadSeq) render();
}

// 그리기
// ---------------------------------------------------------------------
function render() {
  if (!CARDS.length || viewBM === null) return;
  const cur = currentBillMonth();
  const sal = salaryDate(viewBM);
  const title = document.getElementById('title'), lead = document.getElementById('lead');
  if (viewBM === cur) {
    title.textContent = '다음 결제';
    lead.textContent = `${mdKo(sal)}(${dow(sal)}) 급여로 18·20일에 내요.`;
  } else if (viewBM < cur) {
    title.textContent = `${M(viewBM)}월 결제`;
    lead.textContent = today() > payDate('lotte', viewBM) ? `${M(viewBM)}월 18일과 20일에 빠져나갔어요.` : `${M(viewBM)}월 18일과 20일에 빠져나가요.`;
  } else {
    title.textContent = `${M(viewBM)}월 결제`;
    lead.textContent = `${mdKo(sal)}(${dow(sal)}) 급여로 낼 돈이에요. 지금은 할부만 잡혀 있어요.`;
  }
  document.getElementById('back-now').hidden = viewBM === cur;
  if (tab === 'plan') {
    title.textContent = `${M(viewBM)}월 급여 계획`;
    lead.textContent = `${mdKo(sal)}(${dow(sal)}) 급여로 ${M(viewBM)}월 카드값을 내요.`;
  }
  document.getElementById('cards').hidden = tab !== 'spend';
  document.getElementById('plan').hidden = tab !== 'plan';

  document.getElementById('cards').innerHTML = CARDS.map(c => rowHtml(c, monthOf(c.id, viewBM))).join('');
  renderPlan();
  renderSoon(cur);
  if (tab !== 'spend') document.getElementById('soon').hidden = true;
  renderPayslip();
  renderCollector();
}

function barHtml(id, m) {
  const scale = Math.max(m.budget, m.total, 1);
  const iw = m.inst / scale * 100, uw = Math.max(0, m.used) / scale * 100;
  const over = m.budget && m.left < 0;
  // 예산을 넘으면 쓴 돈 부분만 사선 무늬, 예산이 끝나는 자리에 눈금
  const used = over ? `repeating-linear-gradient(-45deg, ${BRAND[id]} 0 5px, ${tint(id, 45)} 5px 10px)` : BRAND[id];
  const tick = over ? `<b class="tick" style="left:${m.budget / scale * 100}%"></b>` : '';
  return `<div class="bar" aria-hidden="true"><i style="width:${iw}%;background:${tint(id, 38)}"></i><i style="width:${uw}%;background:${used}"></i>${tick}</div>`;
}

function whenText(c) {
  const cyc = cycleOf(c.id, viewBM), t = today();
  if (t < cyc.start) return `${md(cyc.start)}부터`;
  if (t > cyc.end) return t > payDate(c.id, viewBM) ? '결제 끝' : `${M(viewBM)}/${c.pay_day} 결제`;
  return `${diffDays(t, cyc.end) + 1}일 남음`;
}

function rowHtml(c, m) {
  const color = BRAND[c.id];
  let amount;
  if (!m.budget) amount = `<div class="unset">예산 정하기</div>`;
  else if (m.left < 0) amount = `<div class="row-amount num" style="color:${color}">${comma(-m.left)}<small>원</small><span class="over-tag" style="background:${color}">초과</span></div>`;
  else amount = `<div class="row-amount num" style="color:${color}">${comma(m.left)}<small>원 남음</small></div>`;
  return `<button class="row" onclick="openCard('${c.id}')" aria-label="${esc(c.name)} 자세히">
    <div class="row-top"><span class="row-name">${esc(c.name)}</span><span class="row-when">${whenText(c)}</span></div>
    ${amount}
    ${barHtml(c.id, m)}
    <div class="row-meta num">
      <span>예산 <b>${m.budget ? won(m.budget) : '없음'}</b></span>
      ${m.inst ? `<span>할부 <b>${won(m.inst)}</b></span>` : ''}
      <span>쓴 돈 <b>${won(m.used)}</b></span>
    </div>
  </button>`;
}

// 이번 결제: 이번 급여로 18·20일에 나갈 카드값 (마지막 결제일이 지나면 사라져요)
function soonData() {
  const cur = currentBillMonth(), prev = addMonths(cur, -1);
  const lastPay = CARDS.reduce((a, c) => (payDate(c.id, prev) > a ? payDate(c.id, prev) : a), '');
  if (today() > lastPay) return null;
  const items = CARDS.map(c => ({ c, v: monthOf(c.id, prev).total }))
    .filter(x => x.v !== 0)
    .sort((a, b) => a.c.pay_day - b.c.pay_day || a.c.sort - b.c.sort);
  if (!items.length) return null;
  return { bm: prev, items, total: items.reduce((a, x) => a + x.v, 0) };
}
function renderSoon(cur) {
  const box = document.getElementById('soon'), d = soonData();
  if (viewBM !== cur || !d) { box.hidden = true; return; }
  box.hidden = false;
  const days = [...new Set(d.items.map(x => x.c.pay_day))].sort((a, b) => a - b).join('·');
  box.innerHTML = `<span><span class="k">이번 결제</span><br><span class="when">${M(d.bm)}월 ${days}일</span></span><span class="v num">${won(d.total)}</span><span class="chev" aria-hidden="true">›</span>`;
}
function openSoon() {
  const d = soonData(); if (!d) return;
  const sal = salaryDate(d.bm);
  openSheet(`
    <h3 id="sheet-title" tabindex="-1">이번 결제</h3>
    <p class="lead">${mdKo(sal)}(${dow(sal)}) 급여가 들어오면 바로 나가요.</p>
    <div class="sheet-amount num">${won(d.total)}</div>
    <ul class="pay-list">${d.items.map(x => `<li><span class="d">${x.c.pay_day}일</span><span>${esc(x.c.name)}<span class="acct">${esc(x.c.account || '')}</span></span><span class="v num">${won(x.v)}</span></li>`).join('')}</ul>
    ${(() => { const p = planOf(d.bm); if (!p.sal.amount) return ''; const left = p.sal.amount - p.setAside - d.total;
      return `<ul class="pay-list" style="margin-top:22px">
        <li><span class="d"></span><span>급여</span><span class="v num">${won(p.sal.amount)}</span></li>
        <li><span class="d"></span><span>먼저 빼둘 돈</span><span class="v num">−${won(p.setAside)}</span></li>
        <li><span class="d"></span><span>카드값</span><span class="v num">−${won(d.total)}</span></li>
        <li><span class="d"></span><span><b>남는 돈</b></span><span class="v num"><b>${won(left)}</b></span></li></ul>
        ${left > 0 ? `<p class="hint">${won(left)}은 추가로 저축할 수 있어요.</p>` : `<p class="hint">${won(-left)} 모자라요. 다음 달 예산을 조금 줄여 보세요.</p>`}`; })()}
    <button class="btn quiet" onclick="closeSheet(); viewBM = ${d.bm}; render(); load();">내역 자세히 보기</button>
  `);
}

function ago(ts) {
  const h = (Date.now() - new Date(ts).getTime()) / 36e5;
  if (h < 1) return `${Math.max(1, Math.round(h * 60))}분 전`;
  if (h < 24) return `${Math.round(h)}시간 전`;
  return `${Math.floor(h / 24)}일 전`;
}
const hoursSince = ts => ts ? (Date.now() - new Date(ts).getTime()) / 36e5 : Infinity;
function renderCollector() {
  const alert = document.getElementById('alert'), line = document.getElementById('collector');
  const st = status || {};
  let warn = null;
  if (!st.sent_at) warn = ['새 수집기를 아직 설치하지 않았어요', '폰에 가계부 수집기를 설치하면 카드 결제가 자동으로 기록돼요.'];
  else if (st.listener_enabled === false) warn = ['폰에서 알림 읽기 권한이 꺼져 있어요', '가계부 수집기 앱을 열고 맨 위 항목을 켜 주세요.'];
  else if (hoursSince(st.sent_at) > 12) warn = [`수집기가 ${ago(st.sent_at)}부터 응답이 없어요`, '폰에서 가계부 수집기 앱을 한 번 열어 주세요. 꺼져 있었다면 다시 깨어나요.'];
  else if (hoursSince(st.last_any_notif) > 8) warn = ['수집기가 알림을 못 듣고 있어요', '폰에서 가계부 수집기 앱을 한 번 열어 주세요. 연결을 다시 붙여요.'];
  else if (st.battery_ok === false) warn = ['배터리 제한을 풀어 주세요', '가계부 수집기 앱에서 "배터리 제한 없음"을 켜 두면 멈추지 않아요.'];
  alert.hidden = !warn;
  if (warn) alert.innerHTML = `<b>${warn[0]}</b>${warn[1]} 그동안 쓴 건 아래 버튼으로 기록할 수 있어요.`;

  const review = st.review_count || 0;
  const reviewBtn = document.getElementById('review-btn');
  reviewBtn.hidden = !review;
  reviewBtn.textContent = `확인이 필요한 알림 ${review}건`;
  line.textContent = st.sent_at
    ? `수집기 신호 ${ago(st.sent_at)}` + (st.last_card_notif ? ` · 마지막 카드 알림 ${ago(st.last_card_notif)}` : '')
    : '수집기 신호 없음';
}

let lastFocus = null;
function openSheet(html, focusSel) {
  const sheet = document.getElementById('sheet');
  lastFocus = document.activeElement;
  sheet.innerHTML = `<div class="grip"></div>${html}`;
  document.getElementById('scrim').classList.add('on');
  sheet.classList.add('on');
  setTimeout(() => { const el = focusSel && sheet.querySelector(focusSel); (el || sheet.querySelector('h3')).focus?.(); }, 220);
}
function closeSheet() {
  document.getElementById('scrim').classList.remove('on');
  document.getElementById('sheet').classList.remove('on');
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

function moneyInput(id, value = '') {
  return `<div class="money"><input class="input" id="${id}" inputmode="numeric" autocomplete="off" value="${value}" oninput="formatMoney(this)"></div>`;
}
function formatMoney(el) {
  const neg = el.value.trim().startsWith('-'), d = el.value.replace(/[^0-9]/g, '');
  el.value = (neg ? '-' : '') + (d ? parseInt(d, 10).toLocaleString('ko-KR') : '');
}

async function saveBudget(id) {
  const amount = num(document.getElementById('budget-input').value);

  const { error } = await db.from('budgets').upsert({ bill_month: viewBM, card_id: id, amount, updated_at: new Date().toISOString() });
  if (error) { console.error(error); document.getElementById('budget-err').textContent = '저장하지 못했어요. 다시 눌러 주세요.'; return; }
  budgets = budgets.filter(b => !(b.bill_month === viewBM && b.card_id === id)).concat({ bill_month: viewBM, card_id: id, amount });
  closeSheet(); render(); toast(`${card(id).name} 예산을 저장했어요`);
}

          <option value="1">일시불</option><option value="2">2개월</option><option value="3">3개월</option><option value="4">4개월</option>
          <option value="5">5개월</option><option value="6">6개월</option><option value="10">10개월</option><option value="12">12개월</option><option value="24">24개월</option>
        </select></div>
    </div>
    <div class="err" id="add-err"></div>
    <button class="btn" id="add-btn" onclick="addPayment()" style="background:${BRAND[addCardId]}">기록하기</button>
  `, '#add-amount');
}
async function addPayment() {
  const err = document.getElementById('add-err');
  const amount = num(document.getElementById('add-amount').value);
  const date = document.getElementById('add-date').value;
  const merchant = document.getElementById('add-merchant').value.trim();
  const months = parseInt(document.getElementById('add-months').value, 10) || 1;
  if (!amount) { err.textContent = '금액을 적어 주세요.'; return; }
  if (!date) { err.textContent = '날짜를 골라 주세요.'; return; }
  const btn = document.getElementById('add-btn'); btn.disabled = true;
  const { error } = await db.from('payments').insert({ card_id: addCardId, paid_at: `${date}T12:00:00+09:00`, amount, merchant: merchant || null, months, source: 'manual' });
  btn.disabled = false;
  if (error) { console.error(error); err.textContent = '기록하지 못했어요. 다시 눌러 주세요.'; return; }
  if (pendingReview) { await db.from('inbox').update({ kind: 'resolved' }).eq('id', pendingReview); pendingReview = null; }
  closeSheet();
  const bm = billMonthOf(addCardId, date);
  toast(bm === currentBillMonth() ? '기록했어요' : `${M(bm)}월 결제에 기록했어요`);
  load();
}

function openLogout() {
  openSheet(`
    <h3 id="sheet-title" tabindex="-1">로그아웃할까요?</h3>
    <p class="lead">다시 들어오려면 이메일과 비밀번호가 필요해요.</p>
    <button class="btn" onclick="db.auth.signOut();closeSheet()">로그아웃</button>
    <button class="btn quiet" onclick="closeSheet()">취소</button>
  `);
}

// ---------------------------------------------------------------------
// 계획: 급여 − 먼저 빼둘 돈 = 카드에 쓸 수 있는 돈 → 카드별 예산
// ---------------------------------------------------------------------
let tab = 'spend';
let salaries = [];
let items = [];
const KINDS = {
  saving: { name: '적금·투자', unit: '매달' },
  fixed: { name: '고정비', unit: '매달' },
  subscription: { name: '구독', unit: '내 몫' },
  sinking: { name: '목돈 모으기', unit: '매달' }
};
const METHODS = ['계좌', '카카오뱅크', '롯데', '농협', '삼성'];
const CARD_METHOD = { '롯데': 'lotte', '농협': 'nh', '삼성': 'samsung' };
const SUB_TARGET = '카카오뱅크';   // 구독을 모으려는 곳

function setTab(t) {
  tab = t;
  ['spend', 'plan'].forEach(k => {
    const b = document.getElementById('tab-' + k);
    if (k === t) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  render();
}

// 급여: 그 달 값이 없으면 바로 전 달 값
function salaryFor(bm) {
  const exact = salaries.find(r => r.bill_month === bm);
  if (exact) return { amount: exact.amount, confirmed: !!exact.confirmed_at, carried: false };
  const prev = salaries.filter(r => r.bill_month < bm).sort((a, b) => b.bill_month - a.bill_month)[0];
  return { amount: prev ? prev.amount : 0, confirmed: false, carried: !!prev };
}
// 다음에 들어올 급여의 청구월
function salaryBillMonth() {
  const t = today(), bm = Number(t.slice(0, 4)) * 100 + Number(t.slice(5, 7));
  return t <= salaryDate(bm) ? bm : addMonths(bm, 1);
}

const itemActive = (i, bm) => (!i.start_month || i.start_month <= bm) && (!i.end_month || i.end_month >= bm);
const deducts = i => i.kind === 'sinking' || !CARD_METHOD[i.method];   // 카드로 나가면 이미 카드값에 들어 있어요
function monthsBetween(a, b) { return (Y(b) - Y(a)) * 12 + (M(b) - M(a)) + 1; }
function monthlyOf(i) {
  if (i.kind !== 'sinking') return i.amount;
  const n = Math.max(1, monthsBetween(i.start_month || viewBM, i.end_month || viewBM));
  return Math.ceil((i.total || 0) / n / 1000) * 1000;
}

function planOf(bm) {
  const sal = salaryFor(bm);
  const act = items.filter(i => itemActive(i, bm));
  const groups = {};
  Object.keys(KINDS).forEach(k => {
    const list = act.filter(i => i.kind === k);
    groups[k] = {
      list,
      sum: list.filter(deducts).reduce((a, i) => a + monthlyOf(i), 0),
      onCard: list.filter(i => !deducts(i)),
      toMove: k === 'subscription' ? list.filter(i => i.method !== SUB_TARGET) : []
    };
  });
  const setAside = Object.values(groups).reduce((a, g) => a + g.sum, 0);
  const available = sal.amount - setAside;
  const cards = CARDS.map(c => ({ c, m: monthOf(c.id, bm) }));
  const budgetSum = cards.reduce((a, x) => a + x.m.budget, 0);
  const closed = CARDS.every(c => today() > cycleOf(c.id, bm).end);
  const actual = cards.reduce((a, x) => a + x.m.total, 0);
  return { sal, groups, setAside, available, cards, budgetSum, closed, actual };
}

function renderPlan() {
  const box = document.getElementById('plan');
  if (tab !== 'plan') { box.innerHTML = ''; return; }
  const p = planOf(viewBM);
  const salTag = p.sal.confirmed ? '<span class="chip">확인함</span>' : p.sal.carried ? '<span class="chip">지난달 금액</span>' : '';
  let html = `<button class="pl" onclick="openSalary(${viewBM})"><span class="n">급여${salTag}</span><span class="v num">${p.sal.amount ? won(p.sal.amount) : '적기'}</span></button>`;

  html += `<div class="pl-h"><strong>먼저 빼둘 돈</strong><span class="num">−${won(p.setAside)}</span></div>`;
  Object.entries(KINDS).forEach(([k, meta]) => {
    const g = p.groups[k];
    const notes = [];
    if (g.list.length) notes.push(`${g.list.length}개`);
    if (g.onCard.length) notes.push(`카드로 나가는 ${g.onCard.length}개는 카드값에 포함`);
    if (k === 'sinking' && g.list.length) notes.push(g.list.map(i => `${i.name} ${M(i.end_month)}월까지 ${won(i.total)}`).join(', '));
    const flag = g.toMove.length ? `<span class="s flag">${SUB_TARGET}로 옮길 구독 ${g.toMove.length}개</span>` : '';
    html += `<button class="pl child" onclick="openGroup('${k}')">
      <span class="n">${meta.name}</span><span class="v num">${g.list.length ? won(g.sum) : '추가하기'}</span>
      ${notes.length ? `<span class="s">${esc(notes.join(' · '))}</span>` : ''}${flag}
    </button>`;
  });
  html += `<div class="pl-sum"><strong>카드에 쓸 수 있는 돈</strong><span class="num">${won(p.available)}</span></div>`;

  html += `<div class="pl-h"><strong>카드 예산</strong><span class="num">${won(p.budgetSum)}</span></div>`;
  p.cards.forEach(({ c, m }) => {
    html += `<button class="pl child" onclick="openCard('${c.id}')">
      <span class="n" style="color:${BRAND[c.id]}">${esc(c.name)}</span><span class="v num">${m.budget ? won(m.budget) : '정하기'}</span>
      <span class="s">${m.inst ? `할부 ${won(m.inst)} 포함 · ` : ''}지금까지 ${won(m.total)}</span>
    </button>`;
  });

  const plannedLeft = p.available - p.budgetSum;
  const realLeft = p.available - p.actual;
  html += `<div class="pl-sum"><strong>${p.closed ? '실제로 남는 돈' : '예산대로 쓰면 남는 돈'}</strong><span class="num">${won(p.closed ? realLeft : plannedLeft)}</span></div>`;
  let tip;
  if (!p.sal.amount) tip = ['급여부터 적어 주세요', '급여를 적으면 카드에 쓸 수 있는 돈을 계산해요.'];
  else if (!p.closed && plannedLeft < 0) tip = [`카드 예산이 ${won(-plannedLeft)} 많아요`, '카드 예산을 줄이거나 빼둘 돈을 다시 봐 주세요.'];
  else if (p.closed && realLeft > 0) tip = [`${won(realLeft)} 추가 저축할 수 있어요`, `카드값이 확정됐어요. ${mdKo(salaryDate(viewBM))} 급여에서 이만큼 더 모아 보세요.`];
  else if (p.closed && realLeft < 0) tip = [`${won(-realLeft)} 모자라요`, '카드값이 쓸 수 있는 돈보다 많아요. 다음 달 예산을 조금 줄여 보세요.'];
  else if (plannedLeft > 0) tip = [`예산대로 쓰면 ${won(plannedLeft)} 더 모을 수 있어요`, '카드값이 확정되면 실제로 남는 돈을 알려 드려요.'];
  if (tip) html += `<div class="tip"><b>${tip[0]}</b>${tip[1]}</div>`;
  box.innerHTML = html;
}

// 급여명세서 알림이 오면 확인 요청
function renderPayslip() {
  const el = document.getElementById('payslip');
  const last = status && status.last_payslip;
  const bm = salaryBillMonth();
  const row = salaries.find(r => r.bill_month === bm);
  const need = last && (!row || !row.confirmed_at || new Date(row.confirmed_at) < new Date(last));
  el.hidden = !need || tab !== 'spend';
  if (need) el.innerHTML = `<b>급여명세서가 왔어요</b>${M(bm)}월 급여 금액을 확인해 주세요.`;
}

function openSalary(bm) {
  const s = salaryFor(bm), sal = salaryDate(bm);
  openSheet(`
    <h3 id="sheet-title" tabindex="-1">${M(bm)}월 급여</h3>
    <p class="lead">${mdKo(sal)}(${dow(sal)})에 들어오는 실수령액이에요.</p>
    <label class="label" for="salary-input">실수령액</label>
    ${moneyInput('salary-input', s.amount ? comma(s.amount) : '')}
    <p class="hint">택사스 급여명세서의 실지급액을 적어 주세요. 다음 달에도 이 금액으로 이어져요.</p>
    <div class="err" id="salary-err"></div>
    <button class="btn" onclick="saveSalary(${bm})">이 금액으로 확인</button>
  `, '#salary-input');
}
async function saveSalary(bm) {
  const amount = num(document.getElementById('salary-input').value);
  if (amount <= 0) { document.getElementById('salary-err').textContent = '급여를 적어 주세요.'; return; }
  const row = { bill_month: bm, amount, confirmed_at: new Date().toISOString(), updated_at: new Date().toISOString() };
  const { error } = await db.from('salaries').upsert(row);
  if (error) { console.error(error); document.getElementById('salary-err').textContent = '저장하지 못했어요. 다시 눌러 주세요.'; return; }
  salaries = salaries.filter(r => r.bill_month !== bm).concat(row);
  closeSheet(); render(); toast(`${M(bm)}월 급여를 확인했어요`);
}

// 항목 묶음 (적금, 고정비, 구독, 목돈)
function openGroup(kind) {
  const meta = KINDS[kind];
  const list = items.filter(i => i.kind === kind && itemActive(i, viewBM));
  const rows = list.map(i => {
    const sub = kind === 'sinking'
      ? `${M(i.end_month)}월까지 ${won(i.total)} · 매달 ${won(monthlyOf(i))}`
      : [i.pay_day ? `${i.pay_day}일` : '', i.method, kind === 'subscription' && i.total && i.total !== i.amount ? `전체 ${won(i.total)}` : '', !deducts(i) ? '카드값에 포함' : ''].filter(Boolean).join(' · ');
    const flag = kind === 'subscription' && i.method !== SUB_TARGET;
    return `<button class="item" style="grid-template-columns:1fr auto" onclick="openItemEdit('${kind}', ${i.id})">
      <span class="t"><span>${esc(i.name)}</span><em ${flag ? 'style="color:#b26a00"' : ''}>${esc(sub)}${flag ? ` · ${SUB_TARGET}로 옮기기` : ''}</em></span>
      <span class="v num" ${deducts(i) ? '' : 'style="color:var(--ink-3)"'}>${won(monthlyOf(i))}</span>
    </button>`;
  }).join('');
  const lead = {
    saving: '급여가 들어오면 먼저 옮겨 두는 돈이에요.',
    fixed: '보험, 통신비, 계처럼 매달 나가는 돈이에요. 카드로 나가는 건 카드값에 이미 들어 있어서 빼지 않아요.',
    subscription: `같이 쓰는 구독은 내 몫만 적어요. ${SUB_TARGET} 체크카드로 모으는 중이에요.`,
    sinking: '여행처럼 큰돈이 나갈 일을 목표 금액과 달로 적으면, 매달 얼마씩 모을지 나눠 드려요.'
  }[kind];
  openSheet(`
    <h3 id="sheet-title" tabindex="-1">${meta.name}</h3>
    <p class="lead">${lead}</p>
    <div class="items">${rows || '<div class="items-empty">아직 없어요</div>'}</div>
    <button class="btn" onclick="openItemEdit('${kind}', null)">추가하기</button>
  `);
}

let editMethod = '계좌';
function methodPick() {
  return METHODS.map(m => `<button type="button" class="${m === editMethod ? 'sel' : ''}" onclick="editMethod='${m}';document.getElementById('method-pick').innerHTML=methodPick()">${m}</button>`).join('');
}
function monthOptions(sel) {
  let o = '';
  for (let k = 0; k < 24; k++) { const bm = addMonths(viewBM, k); o += `<option value="${bm}" ${bm === sel ? 'selected' : ''}>${Y(bm)}년 ${M(bm)}월</option>`; }
  return o;
}
function openItemEdit(kind, id) {
  const i = id ? items.find(x => x.id === id) : null;
  editMethod = i ? i.method : (kind === 'subscription' ? SUB_TARGET : '계좌');
  const meta = KINDS[kind];
  let fields;
  if (kind === 'sinking') {
    fields = `
      <label class="label" for="it-total">목표 금액</label>${moneyInput('it-total', i && i.total ? comma(i.total) : '')}
      <label class="label" for="it-end">쓰는 달</label>
      <select class="input" id="it-end">${monthOptions(i ? i.end_month : addMonths(viewBM, 3))}</select>
      <p class="hint">${M(viewBM)}월부터 쓰는 달까지 똑같이 나눠서 모아요.</p>`;
  } else {
    fields = `
      ${kind === 'subscription' ? `<label class="label" for="it-total">전체 금액</label>${moneyInput('it-total', i && i.total ? comma(i.total) : '')}` : ''}
      <label class="label" for="it-amount">${kind === 'subscription' ? '내 몫' : '매달 금액'}</label>${moneyInput('it-amount', i ? comma(i.amount) : '')}
      ${kind === 'subscription' ? '<p class="hint">혼자 쓰면 전체 금액과 같게 적어요.</p>' : ''}
      <div class="split">
        <div><label class="label" for="it-day">나가는 날</label><input class="input" id="it-day" inputmode="numeric" placeholder="25" value="${i && i.pay_day ? i.pay_day : ''}" style="font-size:16px"></div>
        <div></div>
      </div>
      <span class="label">어디서 나가요</span>
      <div class="pick five" id="method-pick">${methodPick()}</div>`;
  }
  openSheet(`
    <h3 id="sheet-title" tabindex="-1">${i ? esc(i.name) : meta.name + ' 추가'}</h3>
    <label class="label" for="it-name">이름</label>
    <input class="input" id="it-name" value="${i ? esc(i.name) : ''}" placeholder="${{ saving: '청년도약계좌', fixed: '실비보험', subscription: '넷플릭스', sinking: '3월 여행' }[kind]}">
    ${fields}
    <div class="err" id="it-err"></div>
    <button class="btn" onclick="saveItem('${kind}', ${id || 'null'})">저장</button>
    ${i ? `<button class="btn quiet" onclick="removeItem(${i.id}, this)">${M(viewBM)}월부터 빼기</button>` : ''}
  `, i ? null : '#it-name');
}
async function saveItem(kind, id) {
  const err = document.getElementById('it-err');
  const name = document.getElementById('it-name').value.trim();
  if (!name) { err.textContent = '이름을 적어 주세요.'; return; }
  const row = { kind, name };
  if (kind === 'sinking') {
    row.total = num(document.getElementById('it-total').value);
    row.end_month = Number(document.getElementById('it-end').value);
    row.amount = 0; row.method = '계좌';
    if (row.total <= 0) { err.textContent = '목표 금액을 적어 주세요.'; return; }
  } else {
    row.amount = num(document.getElementById('it-amount').value);
    row.total = kind === 'subscription' ? (num(document.getElementById('it-total').value) || row.amount) : null;
    row.pay_day = parseInt(document.getElementById('it-day').value, 10) || null;
    row.method = editMethod;
    if (row.amount <= 0) { err.textContent = '금액을 적어 주세요.'; return; }
  }
  let res;
  if (id) res = await db.from('plan_items').update(row).eq('id', id);
  else { row.start_month = viewBM; row.sort = items.length + 1; res = await db.from('plan_items').insert(row); }
  if (res.error) { console.error(res.error); err.textContent = '저장하지 못했어요. 다시 눌러 주세요.'; return; }
  closeSheet(); toast('저장했어요'); load();
}
async function removeItem(id, btn) {
  if (!btn.dataset.armed) { btn.dataset.armed = '1'; btn.textContent = '한 번 더 누르면 빠져요'; btn.classList.remove('quiet'); btn.classList.add('danger'); return; }
  const i = items.find(x => x.id === id);
  const res = i && i.start_month && i.start_month >= viewBM
    ? await db.from('plan_items').delete().eq('id', id)                       // 이번 달에 만든 건 그냥 지워요
    : await db.from('plan_items').update({ end_month: addMonths(viewBM, -1) }).eq('id', id);   // 지난달까지는 기록으로 남겨요
  if (res.error) { document.getElementById('it-err').textContent = '빼지 못했어요. 다시 눌러 주세요.'; return; }
  closeSheet(); toast('뺐어요'); load();
}

function moveMonth(n) { viewBM = addMonths(viewBM, n); render(); load(); }
function goCurrent() { viewBM = currentBillMonth(); render(); load(); }

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2400);
}

// ---------------------------------------------------------------------
// 로그인
// ---------------------------------------------------------------------
async function isOwner() { const { data, error } = await db.rpc('is_owner'); if (error) throw error; return data === true; }
function showAuth(msg = '') {
  document.body.classList.remove('authed');
  document.getElementById('auth-error').textContent = msg;
  const b = document.getElementById('auth-submit'); b.disabled = false; b.textContent = '로그인';
}
function enter() { document.body.classList.add('authed'); viewBM = null; load(); }
const SCHEMA_MSG = 'Supabase 설정에서 gagyebu 스키마를 열어 주세요. (Data API → Exposed schemas)';
async function init() {
  try {
    const { data } = await db.auth.getSession();
    if (data.session && await isOwner()) return enter();
    if (data.session) await db.auth.signOut();
    showAuth();
  } catch (e) {
    console.error(e);
    showAuth(/schema/i.test(String(e && e.message)) ? SCHEMA_MSG : '서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.');
  }
}
document.getElementById('auth-form').addEventListener('submit', async ev => {
  ev.preventDefault();
  const b = document.getElementById('auth-submit');
  b.disabled = true; b.textContent = '확인하는 중';
  const { error } = await db.auth.signInWithPassword({
    email: document.getElementById('auth-email').value.trim(),
    password: document.getElementById('auth-password').value
  });
  if (error) return showAuth(/Invalid login/i.test(error.message) ? '이메일이나 비밀번호가 맞지 않아요.' : '로그인하지 못했어요. ' + error.message);
  try {
    if (!(await isOwner())) { await db.auth.signOut(); return showAuth('이 계정은 가계부를 볼 수 없어요.'); }
  } catch (e) { return showAuth(SCHEMA_MSG); }
  document.getElementById('auth-password').value = '';
  enter();
});
db.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') { ++loadSeq; showAuth(); } });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && document.body.classList.contains('authed') && !document.getElementById('sheet').classList.contains('on')) load();
});
init();
</script>
