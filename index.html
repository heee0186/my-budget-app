<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>가계부</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg: #f6f6f4; --card: #ffffff; --line: #e8e7e3; --text: #1f1f1d; --sub: #6f6e69; --muted: #a3a29c;
    --good: #2f7d32; --bad: #c62828; --warn: #b26a00; --inst: #c9c7bf; --accent: #1f1f1d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, select { font: inherit; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 16px 16px 96px; }

  /* 상단 */
  .top { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 2px; }
  .top h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.3px; }
  .nav { border: none; background: none; font-size: 20px; padding: 6px 12px; color: var(--sub); }
  .sub { text-align: center; color: var(--sub); font-size: 13px; }
  .today-btn[hidden] { display: none; }
  .today-btn { display: block; margin: 6px auto 0; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 3px 12px; font-size: 12px; color: var(--sub); }
  .status { margin: 14px 0 0; font-size: 12.5px; color: var(--sub); display: flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); flex-shrink: 0; }
  .status.warn { color: var(--bad); background: #fdecea; padding: 8px 10px; border-radius: 10px; }
  .status.warn .dot { background: var(--bad); }

  /* 요약 */
  .summary { margin: 14px 0 12px; padding: 14px 16px; background: var(--card); border-radius: 16px; border: 1px solid var(--line); }
  .summary .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; color: var(--sub); }
  .summary .big { font-size: 15px; color: var(--text); font-weight: 600; }
  .summary .row + .row { margin-top: 6px; }

  /* 카드 */
  .card { background: var(--card); border-radius: 16px; border: 1px solid var(--line); padding: 16px; margin-bottom: 10px; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; }
  .card-name { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .period { font-size: 12px; color: var(--sub); }
  .period.open { color: #1d5fa5; }
  .remain { font-size: 26px; font-weight: 700; margin: 6px 0 10px; letter-spacing: -0.5px; }
  .remain.good { color: var(--good); } .remain.bad { color: var(--bad); } .remain.none { color: var(--muted); font-size: 18px; }
  .bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: #efeeea; }
  .bar > div { height: 100%; }
  .detail { margin-top: 8px; font-size: 12.5px; color: var(--sub); display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .detail b { color: var(--text); font-weight: 600; }
  .edit-budget { border: none; background: none; padding: 0; color: var(--sub); text-decoration: underline dotted; text-underline-offset: 3px; }
  .toggle { margin-top: 10px; width: 100%; border: none; background: #f3f2ee; border-radius: 10px; padding: 8px; font-size: 13px; color: var(--sub); }
  .list { margin-top: 8px; }
  .item { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-top: 1px solid #f0efeb; font-size: 14px; }
  .item .d { width: 38px; color: var(--muted); font-size: 12px; flex-shrink: 0; }
  .item .m { flex: 1; min-width: 0; }
  .item .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .item .tag { font-size: 11px; color: var(--muted); }
  .item .a { font-weight: 600; flex-shrink: 0; }
  .item .a.minus { color: var(--good); }
  .item .x { border: none; background: none; color: #c9c8c2; padding: 2px 4px; font-size: 13px; }
  .empty { color: var(--muted); font-size: 13px; padding: 10px 0 2px; text-align: center; }

  /* 직접 입력 */
  .fab { position: fixed; right: max(20px, calc(50% - 220px)); bottom: 24px; width: 56px; height: 56px; border-radius: 50%; border: none; background: var(--accent); color: #fff; font-size: 28px; box-shadow: 0 6px 16px rgba(0,0,0,.18); }
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: flex-end; justify-content: center; z-index: 50; }
  .sheet-bg.show { display: flex; }
  .sheet { width: 100%; max-width: 480px; background: var(--card); border-radius: 20px 20px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); }
  .sheet h2 { font-size: 17px; margin: 0 0 14px; }
  .seg { display: flex; gap: 6px; margin-bottom: 12px; }
  .seg button { flex: 1; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 10px; font-weight: 600; color: var(--sub); }
  .seg button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .field { display: block; margin-bottom: 10px; }
  .field span { display: block; font-size: 12px; color: var(--sub); margin-bottom: 4px; }
  .field input, .field select { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; font-size: 16px; background: #fff; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .primary { width: 100%; border: none; background: var(--accent); color: #fff; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 600; margin-top: 4px; }
  .ghost { width: 100%; border: none; background: none; color: var(--sub); padding: 12px; margin-top: 2px; }
  .err { color: var(--bad); font-size: 13px; min-height: 18px; margin: 2px 0 6px; }

  .foot { text-align: center; margin-top: 18px; }
  .foot button { border: none; background: none; color: var(--muted); font-size: 12px; text-decoration: underline; }
  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: #1f1f1d; color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 60; white-space: pre-line; text-align: center; }
  .toast.show { opacity: 1; }

  /* 로그인 */
  #auth { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
  body.authed #auth { display: none; }
  body:not(.authed) #app { display: none; }
  .auth-card { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 28px 22px; }
  .auth-card h1 { margin: 0 0 18px; font-size: 22px; }
</style>
</head>
<body>

<div id="auth">
  <form class="auth-card" id="auth-form" autocomplete="on">
    <h1>가계부</h1>
    <label class="field"><span>이메일</span><input id="auth-email" type="email" autocomplete="username" required></label>
    <label class="field"><span>비밀번호</span><input id="auth-password" type="password" autocomplete="current-password" required></label>
    <div class="err" id="auth-error" role="alert"></div>
    <button class="primary" type="submit" id="auth-submit">로그인</button>
  </form>
</div>

<div id="app" class="wrap">
  <div class="top">
    <button class="nav" onclick="moveMonth(-1)" aria-label="이전 달">‹</button>
    <h1 id="title">카드값</h1>
    <button class="nav" onclick="moveMonth(1)" aria-label="다음 달">›</button>
  </div>
  <div class="sub" id="subtitle"></div>
  <button class="today-btn" id="today-btn" onclick="goCurrent()" hidden>이번 달로</button>

  <div class="status" id="status"><span class="dot"></span><span id="status-text">알림 수집 상태 확인 중…</span></div>

  <div class="summary">
    <div class="row"><span>세 카드 합계</span><span class="big" id="sum-used">0원</span></div>
    <div class="row"><span>예산</span><span id="sum-budget">0원</span></div>
    <div class="row"><span>급여 통장 (롯데·삼성)</span><span id="sum-main">0원</span></div>
    <div class="row"><span>농협 통장</span><span id="sum-nh">0원</span></div>
  </div>

  <div id="cards"></div>

  <div class="foot"><button onclick="logout()">로그아웃</button></div>
</div>

<button class="fab" id="fab" onclick="openSheet()" aria-label="직접 입력" hidden>+</button>

<div class="sheet-bg" id="sheet-bg" onclick="if (event.target === this) closeSheet()">
  <div class="sheet">
    <h2>직접 입력</h2>
    <div class="seg" id="add-card"></div>
    <div class="two">
      <label class="field"><span>날짜</span><input type="date" id="add-date"></label>
      <label class="field"><span>할부</span>
        <select id="add-months">
          <option value="1">일시불</option><option value="2">2개월</option><option value="3">3개월</option>
          <option value="4">4개월</option><option value="5">5개월</option><option value="6">6개월</option>
          <option value="10">10개월</option><option value="12">12개월</option><option value="24">24개월</option>
        </select>
      </label>
    </div>
    <label class="field"><span>금액 (취소·환불은 앞에 -)</span><input id="add-amount" inputmode="numeric" placeholder="0" oninput="formatAmount(this)"></label>
    <label class="field"><span>어디서</span><input id="add-merchant" placeholder="가게 이름이나 메모"></label>
    <div class="err" id="add-error"></div>
    <button class="primary" id="add-submit" onclick="addPayment()">기록하기</button>
    <button class="ghost" onclick="closeSheet()">닫기</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// 공개용 publishable 키예요. 실제 보호는 로그인 + 권한 정책(supabase/1-schema.sql)이 해요.
const SUPABASE_URL = 'https://wlrenrjgwqefumsenihc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_cLjOP5RHJNzS5fJlGaA9TA_Heu3DNKS';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { db: { schema: 'gagyebu' } });

// ---------------------------------------------------------------------
// 날짜 · 청구월
//   청구월 202612 = 12월 18·20일에 빠져나가는 카드값
//   카드마다 이용기간이 달라요: 롯데 7일, 삼성 6일, 농협 5일에 새 기간 시작
// ---------------------------------------------------------------------
const SALARY_DAY = 17;
// 주말·공휴일이면 급여가 그 전 평일에 들어와요. (2027년 대체공휴일은 예상치)
const HOLIDAYS = new Set([
  '2026-01-01','2026-02-16','2026-02-17','2026-02-18','2026-03-01','2026-03-02','2026-05-01','2026-05-05',
  '2026-05-24','2026-05-25','2026-06-03','2026-06-06','2026-07-17','2026-08-15','2026-08-17','2026-09-24',
  '2026-09-25','2026-09-26','2026-10-03','2026-10-05','2026-10-09','2026-12-25',
  '2027-01-01','2027-02-06','2027-02-07','2027-02-08','2027-02-09','2027-03-01','2027-05-01','2027-05-05',
  '2027-05-13','2027-06-06','2027-07-17','2027-08-15','2027-08-16','2027-09-14','2027-09-15','2027-09-16',
  '2027-10-03','2027-10-04','2027-10-09','2027-10-11','2027-12-25','2027-12-27'
]);
const pad = n => String(n).padStart(2, '0');
const ymd = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
const Y = bm => Math.floor(bm / 100), M = bm => bm % 100;
function addMonths(bm, n) { const t = Y(bm) * 12 + M(bm) - 1 + n; return Math.floor(t / 12) * 100 + (t % 12) + 1; }
const KST = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' });
const kstDate = ts => KST.format(new Date(ts));
const today = () => kstDate(Date.now());
function addDays(d, n) { const [y, m, dd] = d.split('-').map(Number); return new Date(Date.UTC(y, m - 1, dd + n)).toISOString().slice(0, 10); }
function diffDays(a, b) { const p = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); }; return Math.round((p(b) - p(a)) / 864e5); }
const WEEK = '일월화수목금토';
const dow = d => { const [y, m, dd] = d.split('-').map(Number); return WEEK[new Date(Date.UTC(y, m - 1, dd)).getUTCDay()]; };
const md = d => `${+d.slice(5, 7)}/${+d.slice(8, 10)}`;

let CARDS = [];   // 서버의 gagyebu.cards (롯데 → 농협 → 삼성 순)
const card = id => CARDS.find(c => c.id === id);
function billMonthOf(cardId, date) {
  const [y, m, d] = date.split('-').map(Number);
  return d >= card(cardId).cycle_start ? addMonths(y * 100 + m, 1) : y * 100 + m;
}
function cycleOf(cardId, bm) {
  const s = card(cardId).cycle_start, prev = addMonths(bm, -1);
  return { start: ymd(Y(prev), M(prev), s), end: addDays(ymd(Y(bm), M(bm), s), -1) };
}
function salaryDate(bm) {
  let d = ymd(Y(bm), M(bm), SALARY_DAY);
  while ('토일'.includes(dow(d)) || HOLIDAYS.has(d)) d = addDays(d, -1);
  return d;
}
// 지금 쓰고 있는 청구월: 롯데 기준 (7일이 되면 세 카드 모두 다음 달로 넘어감)
const currentBillMonth = () => billMonthOf('lotte', today());

// 결제 한 건이 어느 청구월에 얼마씩 잡히는지 (할부는 나눠서)
function shares(p) {
  const n = Math.max(1, p.months || 1);
  const bm0 = p.first_bill_month || billMonthOf(p.card_id, kstDate(p.paid_at));
  if (n === 1) return [{ bm: bm0, amount: p.amount, k: 1, n: 1 }];
  const unit = card(p.card_id).installment_unit || 1;
  const monthly = p.monthly || Math.floor(p.amount / n / unit) * unit;
  const first = p.amount - monthly * (n - 1);
  return Array.from({ length: n }, (_, i) => ({ bm: addMonths(bm0, i), amount: i === 0 ? first : monthly, k: i + 1, n }));
}

// ---------------------------------------------------------------------
// 상태
// ---------------------------------------------------------------------
let viewBM = null;
let payments = [];
let budgets = [];     // 모든 예산 행 (적어서 통째로 불러와요)
let status = null;
let openCards = new Set();
let addCard = 'lotte';
let loadSeq = 0;

const won = n => `${Math.round(n).toLocaleString('ko-KR')}원`;
const num = s => { const t = String(s ?? '').replace(/[^0-9-]/g, ''); const v = parseInt(t.replace(/(?!^)-/g, ''), 10); return isNaN(v) ? 0 : v; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function budgetFor(cardId, bm) {
  // 그 달 값이 없으면 바로 전에 정한 값을 그대로 써요
  const rows = budgets.filter(b => b.card_id === cardId && b.bill_month <= bm).sort((a, b) => b.bill_month - a.bill_month);
  return rows.length ? rows[0].amount : 0;
}

// ---------------------------------------------------------------------
// 불러오기
// ---------------------------------------------------------------------
async function load() {
  const seq = ++loadSeq;
  render();
  try {
    if (!CARDS.length) {
      const { data, error } = await db.from('cards').select('*').order('sort');
      if (error) throw error;
      CARDS = data;
      if (viewBM === null) viewBM = currentBillMonth();
    }
    const from = cycleOf('nh', addMonths(viewBM, -25)).start;
    const to = addDays(cycleOf('lotte', viewBM).end, 1);
    const all = [];
    for (let off = 0; ; off += 1000) {
      const { data, error } = await db.from('payments').select('*').eq('hidden', false)
        .gte('paid_at', from + 'T00:00:00+09:00').lt('paid_at', to + 'T00:00:00+09:00')
        .order('paid_at', { ascending: false }).range(off, off + 999);
      if (error) throw error;
      all.push(...data);
      if (data.length < 1000) break;
    }
    const b = await db.from('budgets').select('*');
    if (b.error) throw b.error;
    const s = await db.rpc('collector_status');
    if (seq !== loadSeq) return;
    payments = all; budgets = b.data; status = s.data && s.data[0] ? s.data[0] : null;
  } catch (e) {
    console.error(e);
    if (seq === loadSeq) toast('자료를 불러오지 못했어요.\n인터넷 연결을 확인해 주세요.');
  }
  if (seq === loadSeq) render();
}

// ---------------------------------------------------------------------
// 그리기
// ---------------------------------------------------------------------
function render() {
  if (!CARDS.length || viewBM === null) return;
  const sal = salaryDate(viewBM);
  document.getElementById('title').textContent = `${M(viewBM)}월 카드값`;
  document.getElementById('subtitle').textContent = `${Y(viewBM)}년 · 급여 ${md(sal)}(${dow(sal)}) · 롯데 20일 · 농협·삼성 18일`;
  document.getElementById('today-btn').hidden = viewBM === currentBillMonth();
  renderStatus();

  let sumUsed = 0, sumBudget = 0, sumMain = 0, sumNh = 0;
  const html = CARDS.map(c => {
    const rows = [];
    payments.filter(p => p.card_id === c.id).forEach(p => shares(p).forEach(s => { if (s.bm === viewBM) rows.push({ p, s }); }));
        // 할부 2회차부터는 '이미 정해진 돈' (첫 회차는 이번에 쓴 돈으로 봐요)
    const inst = rows.filter(r => r.s.n > 1 && r.s.k > 1).reduce((a, r) => a + r.s.amount, 0);
    const used = rows.reduce((a, r) => a + r.s.amount, 0) - inst;
    const total = inst + used;
    const budget = budgetFor(c.id, viewBM);
    const left = budget - total;
    sumUsed += total; sumBudget += budget;
    if (c.id === 'nh') sumNh += total; else sumMain += total;

    const cyc = cycleOf(c.id, viewBM), t = today();
    let period, cls = '';
    if (t < cyc.start) period = `${md(cyc.start)}부터 사용`;
    else if (t > cyc.end) period = `${md(cyc.start)}~${md(cyc.end)} · 마감, ${c.pay_day}일 결제`;
    else { period = `${md(cyc.start)}~${md(cyc.end)} · ${diffDays(t, cyc.end) + 1}일 남음`; cls = 'open'; }

    const scale = Math.max(budget, total, 1);
    const instW = Math.min(100, inst / scale * 100);
    const usedW = Math.max(0, Math.min(100 - instW, used / scale * 100));
    const usedColor = left < 0 ? 'var(--bad)' : c.color;
    const remain = !budget
      ? `<div class="remain none">예산을 정해 주세요</div>`
      : `<div class="remain ${left < 0 ? 'bad' : 'good'}">${left < 0 ? won(-left) + ' 초과' : won(left) + ' 남음'}</div>`;

    rows.sort((a, b) => (a.p.paid_at < b.p.paid_at ? 1 : -1));
    const list = openCards.has(c.id) ? `<div class="list">${rows.length ? rows.map(({ p, s }) => {
      const name = p.memo || p.merchant || (p.amount < 0 ? '취소' : '내역 없음');
      const tag = [s.n > 1 ? `할부 ${s.k}/${s.n}` : '', p.memo && p.merchant ? p.merchant : '', p.source === 'notification' ? '알림' : p.source === 'statement' ? '명세서' : ''].filter(Boolean).join(' · ');
      return `<div class="item">
        <span class="d">${md(kstDate(p.paid_at))}</span>
        <span class="m" onclick="editMemo(${p.id})"><span class="name">${esc(name)}</span>${tag ? `<span class="tag">${esc(tag)}</span>` : ''}</span>
        <span class="a ${s.amount < 0 ? 'minus' : ''}">${s.amount < 0 ? '+' + won(-s.amount) : won(s.amount)}</span>
        <button class="x" onclick="hidePayment(${p.id})" aria-label="지우기">✕</button>
      </div>`;
    }).join('') : '<div class="empty">아직 내역이 없어요</div>'}</div>` : '';

    return `<section class="card">
      <div class="card-head"><span class="card-name"><span class="swatch" style="background:${c.color}"></span>${esc(c.name)}</span><span class="period ${cls}">${period}</span></div>
      ${remain}
      <div class="bar"><div style="width:${instW}%;background:var(--inst)"></div><div style="width:${usedW}%;background:${usedColor}"></div></div>
      <div class="detail">
        <span>예산 <button class="edit-budget" onclick="editBudget('${c.id}')">${budget ? won(budget) : '정하기'}</button></span>
        ${inst ? `<span>할부 <b>${won(inst)}</b></span>` : ''}
        <span>쓴 돈 <b>${won(used)}</b></span>
      </div>
      <button class="toggle" onclick="toggleList('${c.id}')">${openCards.has(c.id) ? '내역 접기' : `내역 보기 (${rows.length}건)`}</button>
      ${list}
    </section>`;
  }).join('');
  document.getElementById('cards').innerHTML = html;
  document.getElementById('sum-used').textContent = won(sumUsed);
  document.getElementById('sum-budget').textContent = sumBudget ? `${won(sumBudget)} (${sumBudget - sumUsed >= 0 ? won(sumBudget - sumUsed) + ' 남음' : won(sumUsed - sumBudget) + ' 초과'})` : '미정';
  document.getElementById('sum-main').textContent = won(sumMain);
  document.getElementById('sum-nh').textContent = won(sumNh);
}

function ago(ts) {
  const h = (Date.now() - new Date(ts).getTime()) / 36e5;
  if (h < 1) return `${Math.max(1, Math.round(h * 60))}분 전`;
  if (h < 24) return `${Math.round(h)}시간 전`;
  return `${Math.floor(h / 24)}일 전`;
}
function renderStatus() {
  const box = document.getElementById('status'), text = document.getElementById('status-text');
  if (!status || !status.last_any) { box.className = 'status warn'; text.textContent = '폰 수집기에서 아직 받은 알림이 없어요.'; return; }
  const hours = (Date.now() - new Date(status.last_any).getTime()) / 36e5;
  if (hours > 36) {
    box.className = 'status warn';
    text.textContent = `알림이 ${ago(status.last_any)}부터 안 들어와요. 폰 수집기를 확인해 주세요.`;
  } else {
    box.className = 'status';
    text.textContent = `알림 수집 중 · 마지막 알림 ${ago(status.last_any)}` + (status.last_payment ? ` · 마지막 결제 ${ago(status.last_payment)}` : '');
  }
}

// ---------------------------------------------------------------------
// 동작
// ---------------------------------------------------------------------
function moveMonth(n) { viewBM = addMonths(viewBM, n); openCards.clear(); load(); }
function goCurrent() { viewBM = currentBillMonth(); load(); }
function toggleList(id) { openCards.has(id) ? openCards.delete(id) : openCards.add(id); render(); }

async function editBudget(cardId) {
  const cur = budgetFor(cardId, viewBM);
  const v = prompt(`${card(cardId).name}카드 ${M(viewBM)}월 예산 (다음 달부터도 이 금액으로 이어져요)`, cur ? cur.toLocaleString('ko-KR') : '');
  if (v === null) return;
  const amount = num(v);
  const { error } = await db.from('budgets').upsert({ bill_month: viewBM, card_id: cardId, amount, updated_at: new Date().toISOString() });
  if (error) { console.error(error); return toast('저장하지 못했어요.'); }
  budgets = budgets.filter(b => !(b.bill_month === viewBM && b.card_id === cardId)).concat({ bill_month: viewBM, card_id: cardId, amount });
  render();
}

async function editMemo(id) {
  const p = payments.find(x => x.id === id);
  if (!p) return;
  const v = prompt('메모' + (p.merchant ? ` (가맹점: ${p.merchant})` : ''), p.memo || '');
  if (v === null) return;
  const memo = v.trim() || null;
  const { error } = await db.from('payments').update({ memo }).eq('id', id);
  if (error) return toast('저장하지 못했어요.');
  p.memo = memo; render();
}

async function hidePayment(id) {
  const p = payments.find(x => x.id === id);
  if (!p || !confirm(`${md(kstDate(p.paid_at))} ${p.memo || p.merchant || ''} ${won(p.amount)}\n이 내역을 지울까요?`)) return;
  const { error } = await db.from('payments').update({ hidden: true }).eq('id', id);
  if (error) return toast('지우지 못했어요.');
  payments = payments.filter(x => x.id !== id); render();
}

function openSheet() {
  document.getElementById('add-date').value = today();
  document.getElementById('add-error').textContent = '';
  renderSeg();
  document.getElementById('sheet-bg').classList.add('show');
  setTimeout(() => document.getElementById('add-amount').focus(), 50);
}
function closeSheet() { document.getElementById('sheet-bg').classList.remove('show'); }
function renderSeg() {
  document.getElementById('add-card').innerHTML = CARDS.map(c =>
    `<button class="${c.id === addCard ? 'on' : ''}" onclick="addCard='${c.id}';renderSeg()">${esc(c.name)}</button>`).join('');
}
function formatAmount(el) {
  const neg = el.value.trim().startsWith('-'), d = el.value.replace(/[^0-9]/g, '');
  el.value = (neg ? '-' : '') + (d ? parseInt(d, 10).toLocaleString('ko-KR') : '');
}
async function addPayment() {
  const date = document.getElementById('add-date').value;
  const amount = num(document.getElementById('add-amount').value);
  const merchant = document.getElementById('add-merchant').value.trim();
  const months = parseInt(document.getElementById('add-months').value, 10) || 1;
  const err = document.getElementById('add-error');
  if (!date) { err.textContent = '날짜를 골라 주세요.'; return; }
  if (!amount) { err.textContent = '금액을 입력해 주세요.'; return; }
  const btn = document.getElementById('add-submit');
  btn.disabled = true;
  const { error } = await db.from('payments').insert({
    card_id: addCard, paid_at: `${date}T12:00:00+09:00`, amount, merchant: merchant || null, months, source: 'manual'
  });
  btn.disabled = false;
  if (error) { console.error(error); err.textContent = '기록하지 못했어요. 다시 시도해 주세요.'; return; }
  document.getElementById('add-amount').value = '';
  document.getElementById('add-merchant').value = '';
  document.getElementById('add-months').value = '1';
  closeSheet();
  const bm = billMonthOf(addCard, date);
  toast(bm === viewBM ? '기록했어요' : `${M(bm)}월 카드값으로 기록했어요`);
  load();
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

// ---------------------------------------------------------------------
// 로그인
// ---------------------------------------------------------------------
async function isOwner() { const { data, error } = await db.rpc('is_owner'); if (error) throw error; return data === true; }
function showAuth(msg = '') {
  document.body.classList.remove('authed');
  document.getElementById('fab').hidden = true;
  document.getElementById('auth-error').textContent = msg;
  const b = document.getElementById('auth-submit'); b.disabled = false; b.textContent = '로그인';
}
function enter() {
  document.body.classList.add('authed');
  document.getElementById('fab').hidden = false;
  viewBM = CARDS.length ? currentBillMonth() : null;
  load();
}
async function init() {
  try {
    const { data } = await db.auth.getSession();
    if (data.session && await isOwner()) return enter();
    if (data.session) await db.auth.signOut();
    showAuth();
  } catch (e) {
    console.error(e);
    const msg = String(e && e.message || '');
    showAuth(/schema/i.test(msg) ? 'Supabase 설정에서 gagyebu 스키마를 열어 주세요.\n(Data API → Exposed schemas)' : '서버에 연결하지 못했어요.');
  }
}
document.getElementById('auth-form').addEventListener('submit', async ev => {
  ev.preventDefault();
  const b = document.getElementById('auth-submit');
  b.disabled = true; b.textContent = '확인 중…';
  const { error } = await db.auth.signInWithPassword({
    email: document.getElementById('auth-email').value.trim(),
    password: document.getElementById('auth-password').value
  });
  if (error) return showAuth(/Invalid login/i.test(error.message) ? '이메일 또는 비밀번호가 맞지 않아요.' : '로그인하지 못했어요. ' + error.message);
  try {
    if (!(await isOwner())) { await db.auth.signOut(); return showAuth('이 계정은 가계부를 볼 수 없어요.'); }
  } catch (e) { return showAuth('Supabase 설정에서 gagyebu 스키마를 열어 주세요.'); }
  document.getElementById('auth-password').value = '';
  enter();
});
async function logout() { if (confirm('로그아웃할까요?')) await db.auth.signOut(); }
db.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') { ++loadSeq; showAuth(); } });
// 다른 앱에 갔다 오면 새 결제 반영
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && document.body.classList.contains('authed')) load();
});
init();
</script>
